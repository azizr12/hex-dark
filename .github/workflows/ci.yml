name: Build and Release Hex Editor

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # fetch-depth: 0 is required for the paths-filter action to accurately 
        # detect changes when multiple commits are pushed simultaneously.
        fetch-depth: 0

    - name: Detect VERSION File Changes
      id: check_version
      uses: dorny/paths-filter@v3
      with:
        filters: |
          version:
            - 'VERSION'

    - name: Read Version from File
      if: steps.check_version.outputs.version == 'true'
      id: get_version
      shell: bash
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make

    - name: Build Project
      run: mingw32-make all

    - name: Create GitHub Release
      if: steps.check_version.outputs.version == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Hex Editor v${{ steps.get_version.outputs.version }}
        files: hexedit.exe
        generate_release_notes: true
        make_latest: true
