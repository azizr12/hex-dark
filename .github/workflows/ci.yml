name: Windows C Hex Editor CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build and Test on Windows (MSYS2/MinGW-w64)
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-ncurses
          mingw-w64-x86_64-pkg-config
          make

    - name: Build Project and Plugin
      run: |
        mingw32-make all

    - name: Run Sanity Tests
      run: |
        mingw32-make test

    - name: Bundle Required DLLs (For Dynamic Linking Fallback)
      run: |
        # Copy essential MinGW runtime and ncurses DLLs to the working directory
        cp /mingw64/bin/libncursesw6.dll . || true
        cp /mingw64/bin/libwinpthread-1.dll . || true
        cp /mingw64/bin/libgcc_s_seh-1.dll . || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hexedit-windows-x64
        path: |
          hexedit.exe
          hexedit_plugin.dll
          *.dll
        retention-days: 7
